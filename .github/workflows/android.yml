name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar app web y sincronizar Android
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk fitto.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: fitto-apk
          path: fitto.apk

      - name: Publicar en Releases (descarga directa desde el teléfono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fitto build ${{ github.run_number }}
          prerelease: true
          files: fitto.apk
          body: |
            APK de prueba de Fitto. Descárgalo desde el teléfono e instálalo
            (permite "instalar apps de fuentes desconocidas" si Android lo pide).
